<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RepoSafety</title>
    <link rel="icon" href="logo.png" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0f14;
        color: #e8edf2;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      img {
        width: min(256px, 70vw);
        height: auto;
        border-radius: 22%;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="RepoSafety" width="256" height="256" />
    </main>
  </body>
</html>
